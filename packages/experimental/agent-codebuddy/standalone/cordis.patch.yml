# Selecting this bundle replaces the stock agent factory. DeepSeek providers
# still use AgentLoop. CodeBuddy stays off until a later patch sets enabled.
- id: agent-loop
  disabled: true
- insert:
    - id: agent-codebuddy-settings
      name: '@p1tbu11/dsh-agent-codebuddy/settings'
      config:
        enabled: false
        command: ''
        probe: false
        model: ''
        models: []
        cliSettingsPath: ''
        modelsTimeoutMs: 8000
        stateDir: ''
    - id: agent-codebuddy
      name: '@p1tbu11/dsh-agent-codebuddy'
